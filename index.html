<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Booth 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261126084929">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "./js/anchors.js": "./js/anchors.js?v=20261126084929",
        "./js/app.js": "./js/app.js?v=20261126084929",
        "./js/bu.js": "./js/bu.js?v=20261126084929",
        "./js/controls.js": "./js/controls.js?v=20261126084929",
        "./js/crypto.js": "./js/crypto.js?v=20261126084929",
        "./js/editor.js": "./js/editor.js?v=20261126084929",
        "./js/i18n.js": "./js/i18n.js?v=20261126084929",
        "./js/models.js": "./js/models.js?v=20261126084929",
        "./js/scene.js": "./js/scene.js?v=20261126084929",
        "./js/textures.js": "./js/textures.js?v=20261126084929"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- Password screen -->
  <section id="lock" class="overlay" hidden>
    <form id="lock-form" class="card" autocomplete="on">
      <div class="logo-dot" aria-hidden="true"></div>
      <h1 data-i18n="title">Booth 3D Tour</h1>
      <p class="muted" data-i18n="lockText">This page is private. Type the password you got from the team.</p>
      <input type="text" name="username" value="booth" autocomplete="username" hidden>
      <label for="pw" class="sr" data-i18n="password">Password</label>
      <input id="pw" type="password" placeholder="Password" data-i18n-attr="placeholder:password" autocomplete="current-password" required>
      <button type="submit" data-i18n="open">Open booth</button>
      <p id="lock-error" class="error" role="alert"></p>
    </form>
  </section>

  <div id="loading" class="overlay" hidden><div class="spinner" aria-label="Loading" data-i18n-attr="aria-label:loading"></div></div>

  <!-- Start / pause screen (desktop) -->
  <section id="start" class="overlay dim" hidden>
    <div class="card">
      <h1 id="start-title"></h1>
      <p id="start-sub" class="muted"></p>
      <ul class="keys">
        <li data-i18n-html="keyWalk"></li>
        <li data-i18n-html="keyLook"></li>
        <li data-i18n="keyClick"></li>
        <li data-i18n-html="keyList"></li>
      </ul>
      <button id="start-btn" type="button" data-i18n="enter">Click to enter the booth</button>
      <button id="start-list" type="button" class="ghost" data-i18n="productList">Product list</button>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <div id="hud-info">
      <div id="hud-title"></div>
      <div id="hud-sub"></div>
      <div id="preview-badge" hidden data-i18n="preview">PREVIEW (not saved)</div>
    </div>
    <div id="hint"></div>
  </div>
  <div id="top-actions">
    <button id="list-btn" type="button" hidden title="Product list (P)" aria-keyshortcuts="P" data-i18n-attr="title:productListKey"><span data-i18n="productsBtn">☰ Products</span><kbd class="key-hint" aria-hidden="true">P</kbd></button>
    <button id="lang-btn" type="button" data-i18n="langBtn" data-i18n-attr="aria-label:langBtnLabel,title:langBtnLabel">中文</button>
  </div>
  <div id="crosshair" hidden></div>
  <div id="tooltip" hidden></div>

  <div id="joystick" hidden><div class="knob"></div></div>

  <!-- Product list -->
  <aside id="drawer" hidden>
    <header>
      <h2 data-i18n="products">Products</h2>
      <button id="drawer-close" type="button" class="icon" aria-label="Close" data-i18n-attr="aria-label:close">✕</button>
    </header>
    <ul id="product-list"></ul>
  </aside>

  <!-- Product detail -->
  <aside id="panel" hidden role="dialog" aria-labelledby="p-en">
    <button id="panel-close" type="button" class="icon" aria-label="Close" data-i18n-attr="aria-label:close">✕</button>
    <span id="p-bu" class="chip"></span>
    <h2 id="p-en"></h2>
    <p id="p-zh" class="zh"></p>
    <div id="p-desc"></div>
    <div class="p-actions">
      <a id="p-link" target="_blank" rel="noopener noreferrer" data-i18n="productPage">Product page ↗</a>
      <button id="p-contact" type="button" data-i18n="contact">Contact sales</button>
    </div>
  </aside>

  <!-- Virtual business card (Contact sales) -->
  <div id="card-overlay" class="overlay dim" hidden>
    <div class="bizcard" role="dialog" aria-modal="true" aria-labelledby="c-name-en">
      <button id="card-close" type="button" class="icon" aria-label="Close" data-i18n-attr="aria-label:close">✕</button>
      <div class="bc-brand" id="c-brand"></div>
      <div class="bc-person">
        <div class="bc-name"><span id="c-name-en"></span> <span id="c-name-zh" class="zh"></span></div>
        <div class="bc-title"><span id="c-title-en"></span> <span id="c-title-zh"></span></div>
      </div>
      <dl class="bc-info">
        <div id="c-mobile-row"><dt data-i18n="mobile">Mobile</dt><dd id="c-mobile"></dd></div>
        <div id="c-email-row"><dt data-i18n="email">Email</dt><dd id="c-email"></dd></div>
      </dl>
      <div class="bc-company" id="c-company"></div>
    </div>
  </div>

  <noscript>This page needs JavaScript and WebGL.</noscript>
  <script type="module" src="js/app.js?v=20261126084929"></script>
</body>
</html>
